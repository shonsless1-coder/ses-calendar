function dismissConfirmation(){clearTimeout(confirmationTimer);confirmation.classList.remove('show');confirmation.classList.add('leaving');confirmationTimer=setTimeout(()=>confirmation.classList.remove('leaving'),460)}
function restartConfirmationTimer(){clearTimeout(confirmationTimer);confirmationTimer=setTimeout(dismissConfirmation,3200)}
function showEventConfirmation(title,time,payload=null){clearTimeout(confirmationTimer);pendingConfirmation=payload;confirmation.classList.remove('show','leaving','editable');confirmationTitle.textContent=title;confirmationTime.textContent=time;confirmation.classList.toggle('editable',Boolean(payload));confirmation.setAttribute('role',payload?'button':'status');confirmation.tabIndex=payload?0:-1;void confirmation.offsetWidth;confirmation.classList.add('show');restartConfirmationTimer()}
function fillWheel(wheel,values,selected){wheel.innerHTML=values.map(value=>`<button type="button" class="time-choice${value===selected?' selected':''}" data-value="${value}">${String(value).padStart(2,'0')}</button>`).join('');requestAnimationFrame(()=>{const target=wheel.querySelector(`[data-value="${selected}"]`);if(target)wheel.scrollTop=target.offsetTop-72})}
function selectWheelValue(wheel,value){wheel.querySelectorAll('.time-choice').forEach(choice=>choice.classList.toggle('selected',Number(choice.dataset.value)===value))}
function syncWheel(wheel,kind){const value=Math.round(wheel.scrollTop/36);if(kind==='hour')pickerHour=Math.max(0,Math.min(23,value));else pickerMinute=Math.max(0,Math.min(55,value*5));selectWheelValue(wheel,kind==='hour'?pickerHour:pickerMinute)}
function openTimePicker(){if(!pendingConfirmation||!confirmation.classList.contains('show'))return;clearTimeout(confirmationTimer);const total=Math.round(pendingConfirmation.event.start*60);pickerHour=Math.floor(total/60);pickerMinute=Math.round((total%60)/5)*5;if(pickerMinute===60){pickerHour=(pickerHour+1)%24;pickerMinute=0}fillWheel(hourWheel,Array.from({length:24},(_,i)=>i),pickerHour);fillWheel(minuteWheel,Array.from({length:12},(_,i)=>i*5),pickerMinute);timePickerEvent.textContent=pendingConfirmation.event.title;timePickerBackdrop.classList.add('open');timePickerBackdrop.setAttribute('aria-hidden','false');haptic(8)}
function closeTimePicker(resume=true){timePickerBackdrop.classList.remove('open');timePickerBackdrop.setAttribute('aria-hidden','true');if(resume&&confirmation.classList.contains('show'))restartConfirmationTimer()}
[hourWheel,minuteWheel].forEach((wheel,index)=>{let settle;wheel.addEventListener('scroll',()=>{clearTimeout(settle);settle=setTimeout(()=>syncWheel(wheel,index?'minute':'hour'),70)});wheel.addEventListener('click',event=>{const choice=event.target.closest('.time-choice');if(!choice)return;wheel.scrollTo({top:choice.offsetTop-72,behavior:'smooth'})})});
confirmation.addEventListener('click',openTimePicker);confirmation.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&pendingConfirmation){event.preventDefault();openTimePicker()}});timeCancel.addEventListener('click',()=>closeTimePicker(true));timePickerBackdrop.addEventListener('click',event=>{if(event.target===timePickerBackdrop)closeTimePicker(true)});timeSave.addEventListener('click',()=>{if(!pendingConfirmation)return;syncWheel(hourWheel,'hour');syncWheel(minuteWheel,'minute');const next=pickerHour+pickerMinute/60,event=pendingConfirmation.event,duration=event.end-event.start;event.start=next;event.end=Math.min(24,next+duration);pendingConfirmation.focusEl.querySelector('time').textContent=formatTime(next);const weekEl=pendingConfirmation.weekEl;weekEl.dataset.start=event.start;weekEl.dataset.end=event.end;weekEl.dataset.time=formatTime(next);weekEl.style.top=`${(event.start-5)*pxHour}px`;weekEl.style.height=`${Math.max((event.end-event.start)*pxHour,28)}px`;weekEl.querySelector('small').textContent=formatTime(next);weekEl.setAttribute('aria-label',`${event.title}, ${formatTime(next)}`);confirmationTime.textContent=formatTime(next);haptic([10,30,10]);closeTimePicker(false);restartConfirmationTimer()});
function addNote(value,link=''){confirmation.querySelector('.confirmation-label').textContent='נוצר פתק';confirmation.querySelector('.confirmation-meta').textContent=link?'מקושר לאירוע':'פתק עצמאי';const parts=value.split(/[-–—:]/),title=parts.shift().trim()||value,note={title,body:parts.join(' ').trim(),link};notes.unshift(note);document.querySelector('.notes-column').insertAdjacentHTML('afterbegin',noteMarkup(note,true));haptic(14);showEventConfirmation(title,'פתק',null);quickInput.value='';setQuickOpen(false);move(2);return note}
function parseEventTime(value){const numeric=value.match(/(?:^|\s)(?:ב[-־]?|at\s+)?(\d{1,2})(?::(\d{2}))?(?=\s|$)/i);if(numeric)return{start:Math.min(23,Math.max(5,Number(numeric[1])+(Number(numeric[2]||0)/60))),token:numeric[0]};const words=[['בוקר',7],['צהריים',13],['ערב',20]],found=words.find(([word])=>value.includes(word));return found?{start:found[1],token:found[0]}:null}
function addQuickEvent(value){confirmation.querySelector('.confirmation-label').textContent='נוצר אירוע';confirmation.querySelector('.confirmation-meta').textContent='היום · שעה אחת';const parsed=parseEventTime(value),start=parsed?parsed.start:9,title=(parsed?value.replace(parsed.token,' '):value).trim()||value,event={day:0,start,end:Math.min(24,start+1),title,tone:'sage'};events.push(event);const focusList=document.querySelector('.today');focusList.insertAdjacentHTML('beforeend',`<article class="focus-event"><time>${formatTime(start)}</time><b>${title}</b></article>`);const focusEl=focusList.lastElementChild,col=document.querySelectorAll('.daycol')[0];col.insertAdjacentHTML('beforeend',`<article class="week-event sage" data-start="${event.start}" data-end="${event.end}" data-time="${formatTime(event.start)}" style="top:${(event.start-5)*pxHour}px;height:${Math.max((event.end-event.start)*pxHour,28)}px" aria-label="${title}, ${formatTime(event.start)}"><b>${title}</b><small>${formatTime(event.start)}</small></article>`);const weekEl=col.lastElementChild;makeDraggable(weekEl);haptic(14);showEventConfirmation(title,formatTime(start),{event,focusEl,weekEl});quickInput.value='';setQuickOpen(false)}
typedEntry.addEventListener('submit',event=>{event.preventDefault();const value=quickInput.value.trim();if(!value)return;setQuickOpen(false);const parsedTime=parseEventTime(value);if(parsedTime)addQuickEvent(value);else{const [text,linked]=value.split('|').map(part=>part.trim());addNote(text,linked||'')}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
