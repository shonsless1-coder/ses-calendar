<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SES</title><meta name="description" content="A minimal focus and week calendar.">
<meta name="theme-color" content="#fffefa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SES">

<style>
html,body,#app{margin:0;min-height:100%;overflow-x:hidden}:root{--bg:#f7f5ef;--paper:#fffefa;--ink:#171714;--muted:#86857e;--line:#deddd5;--soft:#eeece5;--sage:#a8c7ba;--sage-ink:#355e53;--coral:#ed6a5a;--coral-soft:#f8c2b9;--blue:#aab8cf}:root[data-theme="dark"]{--bg:#131412;--paper:#181916;--ink:#f2f0e9;--muted:#8f908a;--line:#353630;--soft:#242521;--sage:#79aa98;--sage-ink:#c6e7dc;--coral:#f07a69;--coral-soft:#6c3f37;--blue:#778aa8}*{box-sizing:border-box}body{background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app-shell{position:relative;width:100%;min-height:100svh;background:var(--paper);color:var(--ink);overflow:hidden;transition:background .25s,color .25s}.pager{width:200%;display:flex;transition:transform .55s cubic-bezier(.22,.85,.25,1);will-change:transform}.screen{width:50%;min-height:100svh;padding:28px clamp(20px,5vw,72px) calc(72px + env(safe-area-inset-bottom));position:relative}.topline{height:48px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.brand-mark.small{font-family:Georgia,serif;font-size:19px;letter-spacing:.08em}.brand-name{font-size:13px;font-weight:650;letter-spacing:.18em}.page-count{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:.12em}.theme{position:fixed;z-index:20;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:46px;height:46px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);color:var(--ink);border-radius:50%;font-size:20px;box-shadow:0 8px 22px #0002;cursor:pointer}.hero{padding:64px 0 58px}.hero p{margin:0 0 8px;color:var(--muted);font-size:15px}.hero h1,.week-title h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em;margin:0}.hero h1{font-size:clamp(46px,12vw,92px);line-height:.94}.today{max-width:660px}.section-line{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.16em;padding-bottom:10px;border-bottom:1px solid var(--line)}.focus-event{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}.focus-event time{font-size:13px;color:var(--muted)}.focus-event b{display:block;font-size:15px;font-weight:600}.swipe-hint{margin-top:34px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.swipe-hint span{color:var(--coral);font-size:16px;margin-left:7px}.swipe-hint.left span{margin:0 7px 0 0}.week-title{display:flex;align-items:end;justify-content:space-between;padding:36px 0 24px}.week-title>div>span{display:block;color:var(--coral);font-size:10px;letter-spacing:.16em;margin-bottom:6px}.week-title h1{font-size:clamp(30px,7vw,52px)}.week-legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.week-legend i{width:7px;height:7px;border-radius:50%;margin-left:7px}.week-legend i.sage{background:var(--sage)}.week-legend i.coral{background:var(--coral)}.week-wrap{overflow-y:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.days{height:60px;display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}.day{display:flex;flex-direction:column;justify-content:center;align-items:center;border-left:1px solid var(--line);gap:3px}.day span{font-size:8px;color:var(--muted);letter-spacing:.1em}.day b{font-size:15px;font-weight:500}.day.active b{color:var(--paper);background:var(--coral);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}.grid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));position:relative;height:812px}.times{position:relative}.times span{position:absolute;right:5px;transform:translateY(-5px);font-size:7px;color:var(--muted)}.daycol{position:relative;border-left:1px solid var(--line);background:var(--paper)}.daycol.active{background:color-mix(in srgb,var(--coral) 3%,var(--paper))}.daycol>i{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.week-event{position:absolute;left:3px;right:3px;padding:5px 4px;border-radius:5px;overflow:hidden;z-index:2;color:#222}.week-event.sage{background:var(--sage)}.week-event.coral{background:var(--coral-soft)}.week-event.blue{background:var(--blue)}.week-event b,.week-event small{display:block;overflow:hidden;text-overflow:ellipsis}.week-event b{font-size:clamp(7px,2vw,10px);line-height:1.05}.week-event small{font-size:7px;margin-top:2px;opacity:.68}.quick-add{position:fixed;z-index:18;left:18px;right:78px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:620px;margin:auto}.quick-add form{display:flex;align-items:center;padding:5px 6px 5px 16px;border:1px solid var(--line);border-radius:25px;background:color-mix(in srgb,var(--paper) 94%,transparent);box-shadow:0 8px 28px #0002;backdrop-filter:blur(16px)}.quick-add input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px}.quick-add input::placeholder{color:var(--muted)}.quick-add button{border:0;border-radius:50%;width:34px;height:34px;background:var(--ink);color:var(--paper);font-size:18px}.quick-note{display:block;height:15px;padding:3px 14px 0;color:var(--muted);font-size:9px;text-align:center}.dots{position:fixed;z-index:19;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}.dots button{border:0;width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.4;padding:0}.dots button.on{width:22px;border-radius:5px;background:var(--coral);opacity:1}.loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;transition:opacity .35s,visibility .35s}.loader.done{opacity:0;visibility:hidden}.brand-mark{font-family:Georgia,serif;font-size:clamp(72px,22vw,112px);font-weight:400;letter-spacing:.08em}.loader span{display:none}@media(max-width:600px){.screen{padding:20px 18px calc(68px + env(safe-area-inset-bottom))}.hero{padding:54px 0 48px}.week-title{padding:24px 0 16px}.week-legend{display:none}.week-screen{padding-left:10px;padding-right:10px}.week-screen .topline,.week-screen .week-title,.week-screen>.swipe-hint{margin-left:8px;margin-right:8px}.week-event{padding:4px 2px}.week-event b{white-space:normal;word-break:break-word}.week-event small{display:none}}@media(min-width:900px){.focus-screen{display:grid;grid-template-columns:1.05fr .95fr;column-gap:8vw;align-content:start}.focus-screen .topline{grid-column:1/-1}.hero{padding-top:110px}.today{padding-top:112px}.focus-screen .swipe-hint{grid-column:1/-1}.week-wrap{max-height:720px;overflow-y:auto}}@media(prefers-reduced-motion:reduce){.pager,.loader{transition:none}}
</style></head><body><div id="app"></div>
<script>
const events=[{day:0,start:9,end:10.5,title:'FBC team sync',tone:'sage'},{day:0,start:12.5,end:13.25,title:'Lunch with Eve',tone:'coral'},{day:0,start:15,end:16,title:'Client call',tone:'sage'},{day:0,start:18.5,end:19.5,title:'Run by the Yarkon',tone:'blue'},{day:1,start:10,end:11,title:'1:1 with partner',tone:'sage'},{day:1,start:19,end:20,title:'Grocery run',tone:'coral'},{day:2,start:9.5,end:11,title:'Draft review',tone:'sage'},{day:2,start:20,end:21.5,title:'Dinner',tone:'coral'},{day:3,start:8,end:8.75,title:'Physio',tone:'blue'},{day:3,start:13,end:14,title:'Court filing',tone:'sage'},{day:4,start:9,end:9.5,title:'Standup',tone:'sage'},{day:4,start:17,end:18,title:'Dentist',tone:'blue'},{day:5,start:11.5,end:13,title:'Brunch',tone:'coral'},{day:5,start:18,end:20,title:'Friends',tone:'coral'},{day:6,start:10,end:11,title:'Weekly reset',tone:'blue'},{day:6,start:16,end:17.5,title:'Family',tone:'coral'}];
const dayNames=['SUN','MON','TUE','WED','THU','FRI','SAT'],dayNums=[20,21,22,23,24,25,26],hours=Array.from({length:15},(_,i)=>7+i),pxHour=58;
const mark=(small=false)=>`<span class="brand-mark ${small?'small':''}" aria-label="SES">SES</span>`;
function focus(){const today=events.filter(e=>e.day===0);return `<section class="screen focus-screen" aria-label="Focus view"><div class="topline">${mark(true)}<span class="page-count">01 / 02</span></div><div class="hero"><p>Good morning, Shaun.</p><h1>Sunday,<br>September 20</h1></div><div class="today" aria-label="Today's schedule"><div class="section-line"><span>TODAY</span><span>${today.length} EVENTS</span></div>${today.map(e=>`<article class="focus-event"><time>${String(Math.floor(e.start)).padStart(2,'0')}:${e.start%1?'30':'00'}</time><b>${e.title}</b></article>`).join('')}</div><div class="swipe-hint">Swipe for week <span>→</span></div></section>`}
function week(){return `<section class="screen week-screen" aria-label="Week view"><div class="topline">${mark(true)}<span class="page-count">02 / 02</span></div><div class="week-title"><div><span>WEEK 39</span><h1>September 20-26</h1></div><div class="week-legend"><i class="sage"></i>work <i class="coral"></i>life</div></div><div class="week-wrap"><div class="days"><div></div>${dayNames.map((d,i)=>`<div class="day ${i===0?'active':''}"><span>${d}</span><b>${dayNums[i]}</b></div>`).join('')}</div><div class="grid"><div class="times">${hours.slice(0,-1).map(h=>`<span style="top:${(h-7)*pxHour}px">${h}:00</span>`).join('')}</div>${dayNames.map((_,i)=>`<div class="daycol ${i===0?'active':''}">${hours.slice(0,-1).map(h=>`<i style="top:${(h-7)*pxHour}px"></i>`).join('')}${events.filter(e=>e.day===i).map(e=>`<article class="week-event ${e.tone}" style="top:${(e.start-7)*pxHour}px;height:${Math.max((e.end-e.start)*pxHour,28)}px"><b>${e.title}</b><small>${Math.floor(e.start)}:${e.start%1?'30':'00'}</small></article>`).join('')}</div>`).join('')}</div></div><div class="swipe-hint left"><span>←</span> Back to focus</div></section>`}
document.getElementById('app').innerHTML=`<main class="app-shell"><div class="loader">${mark()}<span>SES</span></div><button class="theme" aria-label="Toggle dark mode">◐</button><div class="pager">${focus()}${week()}</div><div class="quick-add"><form><input aria-label="Add an event in natural language" placeholder="Dinner with Eve tomorrow at 20:00"><button aria-label="Preview event" type="submit">↑</button></form><span class="quick-note"></span></div><nav class="dots" aria-label="Calendar view"><button class="on" aria-label="Focus view"></button><button aria-label="Week view"></button></nav></main>`;
let page=0,touch=null;const pager=document.querySelector('.pager'),dots=[...document.querySelectorAll('.dots button')];function move(n){page=Math.max(0,Math.min(1,n));pager.style.transform=`translateX(-${page*50}%)`;dots.forEach((d,i)=>d.classList.toggle('on',i===page))}dots.forEach((d,i)=>d.onclick=()=>move(i));pager.addEventListener('touchstart',e=>touch=e.touches[0].clientX,{passive:true});pager.addEventListener('touchend',e=>{if(touch===null)return;const dx=e.changedTouches[0].clientX-touch;if(Math.abs(dx)>42)move(page+(dx<0?1:-1));touch=null},{passive:true});
const theme=document.querySelector('.theme'),saved=localStorage.getItem('ses-theme'),preferDark=matchMedia('(prefers-color-scheme:dark)').matches;let dark=saved?saved==='dark':preferDark;function apply(){document.documentElement.dataset.theme=dark?'dark':'light';theme.textContent=dark?'☀︎':'◐';document.querySelector('meta[name="theme-color"]').content=dark?'#181916':'#fffefa'}apply();theme.onclick=()=>{dark=!dark;localStorage.setItem('ses-theme',dark?'dark':'light');apply()};setTimeout(()=>document.querySelector('.loader').classList.add('done'),850);
const quick=document.querySelector('.quick-add form'),quickInput=quick.querySelector('input'),quickNote=document.querySelector('.quick-note');quick.onsubmit=e=>{e.preventDefault();const value=quickInput.value.trim();if(!value)return;quickNote.textContent=`Preview only · ${value}`;quickInput.value='';setTimeout(()=>{quickNote.textContent=''},4200)};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
